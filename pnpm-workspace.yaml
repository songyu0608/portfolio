# 설치 스크립트 허용 목록(pnpm 11). wrangler(T17)의 하위 의존성 esbuild·workerd는 postinstall로
# 플랫폼별 실행 파일을 고르지만, 실행 파일은 선택적 의존성(@esbuild/<플랫폼>, @cloudflare/workerd-<플랫폼>)에서
# 찾으므로 스크립트 없이도 wrangler dev·deploy가 동작한다. 그래서 실행하지 않는다(false).
allowBuilds:
  esbuild: false
  workerd: false
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.6'
  - '@astrojs/prism@4.1.2'
  - '@astrojs/react@7.1.2'
  - '@astrojs/telemetry@3.4.2'
  - astro@7.4.4
