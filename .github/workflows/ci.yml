name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# main에 새 push가 오면 이전 실행을 deploy 작업까지 취소한다. 그래서 이전 커밋이 새 커밋보다
# 늦게 배포되지 않는다(T17, docs/tasks/T17-deploy-base.md 메모 "main 실행 취소와 배포").
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # E2E(T15) 포함. 실제 걸린 시간은 T15 PR에 적었다(목표: E2E 단계 10분 이하).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      # E2E(T15, docs/ARCHITECTURE.md "테스트"). 브라우저는 캐시하지 않는다(Playwright 공식 권장).
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: E2E tests
        run: pnpm test
      # Cloudflare에서만 정해지는 동작(T17): wrangler dev로 `/` 301·404·응답 헤더를 확인한다.
      - name: Cloudflare behavior tests
        run: pnpm test:workers
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Lighthouse 점수 기준(T16, docs/ARCHITECTURE.md "테스트"). check와 동시에, 폼팩터마다 작업 하나.
  # 포맷·lint·타입 체크는 check 작업이 하므로 여기서 반복하지 않는다.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 한쪽이 실패해도 다른 폼팩터 결과를 남긴다.
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Lighthouse가 띄울 Chromium. 버전은 lockfile의 Playwright 버전으로 고정된다(캐시하지 않음).
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # 점수 요약 표는 작업 요약(GITHUB_STEP_SUMMARY)에 나온다.
      - name: Lighthouse
        run: pnpm lighthouse --project=${{ matrix.form-factor }}
      - name: Upload Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ matrix.form-factor }}
          path: lighthouse-report/
          retention-days: 7

  # 배포(T17, docs/ARCHITECTURE.md §2 "배포"). main push에서 check·lighthouse가 모두 통과한 뒤에만 돈다.
  # PR에서는 건너뛴다. 비밀 값은 GitHub 환경 production(배포 브랜치 main만)에서 받는다.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # 배포 단계에 GitHub 토큰을 남기지 않는다.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # cloudflare/wrangler-action 대신 lockfile에 고정한 wrangler를 그대로 쓴다(T17 지시서 메모).
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
